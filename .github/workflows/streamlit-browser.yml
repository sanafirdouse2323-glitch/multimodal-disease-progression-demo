name: Streamlit browser checks (separate from core)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app.py"
      - "tests/test_raw_checkpoint_integration.py"
      - "train_multimodal_raw_image_model.py"
      - "predict_multimodal_raw_image_model.py"
      - "raw_image_model.py"
      - "requirements.txt"
      - ".github/workflows/streamlit-browser.yml"
  workflow_dispatch:

jobs:
  streamlit-browser:
    name: Streamlit guided workflow in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-cache-v1

      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install browser test dependencies
        run: python -m pip install playwright && python -m playwright install --with-deps chromium

      - name: Compile application and inference scripts
        run: python -m py_compile app.py predict_multimodal_raw_image_model.py train_multimodal_raw_image_model.py

      - name: Test trained checkpoint, CLI inference, and guided Streamlit browser workflow
        env:
          SKIP_STREAMLIT_BROWSER_TEST: "0"
        run: python -m unittest discover -s tests -p 'test_raw_checkpoint_integration.py' -v
