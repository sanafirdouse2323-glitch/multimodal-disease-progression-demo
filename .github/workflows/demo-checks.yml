name: Demo checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Compile application and inference scripts
        run: python -m py_compile app.py predict_multimodal_raw_image_model.py train_multimodal_raw_image_model.py
      - name: Run unit tests (excluding the long end-to-end integration test)
        run: |
          python -m unittest discover -s tests -p 'test_demo.py' -v
          python -m unittest discover -s tests -p 'test_multimodal_raw_image_model.py' -v
          python -m unittest discover -s tests -p 'test_raw_image_model.py' -v
          python -m unittest discover -s tests -p 'test_raw_image_training_smoke.py' -v
      - name: Exercise trained checkpoint, CLI inference, and guided Streamlit browser workflow
        run: python -m unittest discover -s tests -p 'test_raw_checkpoint_integration.py' -v
      - name: Run complete synthetic demo
        run: python demo_disease_progression.py
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-results
          path: results/
          if-no-files-found: warn
