name: Demo checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application and inference scripts
        run: python -m py_compile app.py predict_multimodal_raw_image_model.py train_multimodal_raw_image_model.py experiments/missing_modality_robustness.py
      - name: Run unit and smoke tests
        run: python -m unittest discover -s tests -v
      - name: Exercise training checkpoint and end-to-end prediction
        run: python -m unittest discover -s tests -p 'test_raw_checkpoint_integration.py' -v
      - name: Smoke-test missing-feature-group experiment
        run: >-
          python experiments/missing_modality_robustness.py
          --n-patients 40 --epochs 1 --batch-size 16 --seeds 42 --cpu
          --output-dir results/missing_feature_group_robustness_smoke
      - name: Run complete synthetic demo
        run: python demo_disease_progression.py
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-results
          path: results/
          if-no-files-found: warn
