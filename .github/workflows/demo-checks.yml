name: Focused Streamlit upload diagnostic

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  upload-smoke:
    name: Focused scan-upload test (diagnostic only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-cache-v1
      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Compile application and focused test
        run: python -m py_compile app.py tests/test_streamlit_upload_smoke.py
      - name: Test scan upload delivery only
        run: python -m unittest discover -s tests -p 'test_streamlit_upload_smoke.py' -v
