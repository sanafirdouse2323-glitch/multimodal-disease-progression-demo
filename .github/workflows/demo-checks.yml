name: Core checks (without Streamlit browser)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  core-tests:
    name: Core training, CLI inference, and synthetic demo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application, core, and raw-image scripts
        run: python -m py_compile app.py demo_disease_progression.py train_raw_image_model.py predict_raw_image_model.py train_multimodal_raw_image_model.py predict_multimodal_raw_image_model.py run_synthetic_raw_image_demo.py
      - name: Validate synthetic raw-image runner command
        run: python run_synthetic_raw_image_demo.py --help
      - name: Verify installable project metadata and CLI entry points
        run: |
          python -m pip install --no-deps .
          mdp-train-image --help
          mdp-predict-image --help
          mdp-train-multimodal --help
          mdp-predict-multimodal --help
      - name: Run existing unit tests
        run: |
          python -m unittest discover -s tests -p 'test_demo.py' -v
          python -m unittest discover -s tests -p 'test_multimodal_raw_image_model.py' -v
          python -m unittest discover -s tests -p 'test_raw_image_model.py' -v
          python -m unittest discover -s tests -p 'test_raw_image_prediction.py' -v
          python -m unittest discover -s tests -p 'test_raw_image_training_smoke.py' -v
      - name: Train checkpoint and verify two-visit CLI inference (no Streamlit)
        env:
          SKIP_STREAMLIT_BROWSER_TEST: "1"
        run: python -m unittest discover -s tests -p 'test_raw_checkpoint_integration.py' -v
      - name: Run end-to-end smoke test for both raw-image pipelines
        run: python run_synthetic_raw_image_demo.py --output-dir raw_image_smoke_demo --patients 20 --epochs 1 --batch-size 2 --seed 42
      - name: Run complete synthetic demo
        run: python demo_disease_progression.py
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-demo-results
          path: results/
          if-no-files-found: warn
      - name: Upload synthetic raw-image smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-raw-image-smoke-results
          path: raw_image_smoke_demo/
          if-no-files-found: warn
